name: Build and publish Docker image to GHCR

on:
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/incel-hrm-backend
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/base.txt -r requirements/dev.txt

      - name: Run full test suite
        env:
          DJANGO_SETTINGS_MODULE: hrm_backend.settings.base
          # CI-only values — not production secrets
          SECRET_KEY: django-insecure-ci-test-key-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
          FRONTEND_BASE_URL: http://localhost:3000
        run: python manage.py test

  docker-build-and-push:
    needs: test
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging,enable=${{ github.base_ref == 'staging' }}
            type=ref,event=branch,enable=${{ github.base_ref == 'main' }}
            type=sha
            type=raw,value=latest,enable=${{ github.base_ref == 'main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
